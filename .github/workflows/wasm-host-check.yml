name: wasm host check

# TEMPORARY verification job (removed before this change is finished): runs the WASM kit fixture
# through EffectCraft's real plug-in host (wasmi) and then through the shipped CLI on a runner,
# and posts the output as a PR comment so the evidence is readable without log access.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version | tee /tmp/toolchain.log
          cargo --version | tee -a /tmp/toolchain.log

      - name: Real host check (effectcraft-plugin, wasmi 2.0)
        run: |
          cd tools/wasm-effect-kit/host
          cargo run --release 2>&1 | tee /tmp/host.log

      - name: Plug-in crate tests
        run: cargo test -p effectcraft-plugin 2>&1 | tee /tmp/tests.log | tail -25

      - name: Build the CLI
        run: cargo build -p effectcraft-cli 2>&1 | tail -5

      - name: "App stage load"
        env:
          EFFECTCRAFT_CLI: target/debug/effectcraft-cli
        run: ./tools/wasm-effect-kit/app_check.sh load 2>&1 | tee /tmp/app-load.log

      - name: "App stage project"
        env:
          EFFECTCRAFT_CLI: target/debug/effectcraft-cli
        run: ./tools/wasm-effect-kit/app_check.sh project 2>&1 | tee /tmp/app-project.log | tail -40

      - name: "App stage render"
        env:
          EFFECTCRAFT_CLI: target/debug/effectcraft-cli
        run: ./tools/wasm-effect-kit/app_check.sh render 2>&1 | tee /tmp/app-render.log | tail -40

      - name: Publish the evidence as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### WASM host + application check (run ${{ github.run_id }})"
            echo
            echo '```'
            cat /tmp/toolchain.log 2>/dev/null || echo "(no toolchain log)"
            echo '```'
            echo
            echo "#### effectcraft-plugin host (wasmi): \`cargo run --release\`"
            echo '```'
            tail -30 /tmp/host.log 2>/dev/null || echo "(step did not run or produced no log)"
            echo '```'
            echo
            echo "#### cargo test -p effectcraft-plugin"
            echo '```'
            tail -12 /tmp/tests.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo
            echo "#### app_check.sh load"
            echo '```'
            tail -25 /tmp/app-load.log 2>/dev/null || echo "(stage did not run)"
            echo '```'
            echo
            echo "#### app_check.sh project"
            echo '```'
            tail -25 /tmp/app-project.log 2>/dev/null || echo "(stage did not run)"
            echo '```'
            echo
            echo "#### app_check.sh render"
            echo '```'
            tail -25 /tmp/app-render.log 2>/dev/null || echo "(stage did not run)"
            echo '```'
          } > /tmp/report.md
          gh pr comment "$PR" --body-file /tmp/report.md
