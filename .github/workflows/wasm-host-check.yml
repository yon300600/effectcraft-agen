name: wasm host check (temporary verification job)
on:
  workflow_dispatch:
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Real-host check (effectcraft-plugin, wasmi)
        run: cd tools/wasm-effect-kit/host && cargo run --release
      - name: Plug-in crate tests
        run: cargo test -p effectcraft-plugin
